name: Update Parsers

on:
  schedule:
    # Run on the 1st and 15th of each month at 00:00 UTC
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-parsers:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refresh apt index
        run: sudo apt-get update

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Install dependencies
        run: shards install

      - name: Build CLI
        run: crystal build scripts/cli.cr -o cli

      - name: Update parsers
        run: ./cli --update-parsers

      - name: Build application
        run: shards build bit --release --no-debug
        env:
          ENV: production

      - name: Run tests
        run: crystal spec
        env:
          ENV: test

      - name: Run end-to-end tests
        run: crystal spec e2e
        env:
          ENV: test

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update parsers'
          title: 'chore: Update UA regexes and GeoLite2 database'
          body: |
            ## Automated Parser Update

            This PR updates the following data files:
            - User Agent parsing regexes
            - GeoLite2 database

            **Triggered by**: Scheduled workflow (runs on the 1st and 15th of each month)
            **Date**: ${{ github.event.repository.updated_at }}

            Please review the changes and merge if everything looks good.
          branch: automated/update-parsers
          delete-branch: true
          labels: |
            dependencies
            automated
